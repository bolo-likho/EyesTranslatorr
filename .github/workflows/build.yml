name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip EyesTranslator.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: cd EyesTranslator && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: EyesTranslator/app/build/outputs/apk/debug/app-debug.apk
